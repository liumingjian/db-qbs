# M0 本地 Oracle 11.2 替身台架 —— 服务于 #9，供 #3 / #6 开箱即用。
#
# 平台分配是这套台架成立的关键：
#   oracle  linux/amd64 （Rosetta 模拟）—— ARM 版 Oracle 11g 不存在，也不会有
#   mysql   linux/arm64 原生
#   client  linux/arm64 原生 —— Instant Client 与 spike 程序全速跑
#
# 因为服务端在模拟层上，本台架的**性能数字全部作废**，不能用来做 #5。
services:
  oracle:
    image: gvenzl/oracle-xe:11.2.0.2-slim-faststart
    platform: linux/amd64
    container_name: qbs-oracle11
    environment:
      ORACLE_PASSWORD: spike123      # SYSTEM / SYS 口令
      APP_USER: spike                # 台架 schema
      APP_USER_PASSWORD: spike123
    ports:
      - "1521:1521"
    volumes:
      - ./oracle:/container-entrypoint-initdb.d:ro
    networks: [default, src-side]   # default 是既有台架那张网，一个字节不变
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: qbs-mysql8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: spike123
      MYSQL_DATABASE: qbs
      MYSQL_USER: spike
      MYSQL_PASSWORD: spike123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
    networks: [default, dst-side]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pspike123"]
      interval: 10s
      timeout: 5s
      retries: 30

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    platform: linux/arm64
    container_name: qbs-client
    ports:
      # M2 runs db-qbs-source on the host and the sink here, so the sink port has to leave
      # the container. Bound to the host loopback only.
      - "127.0.0.1:18080:18080"
    depends_on:
      oracle:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      # spike 程序按这两个变量取连接串，别在代码里写死
      ORACLE_DSN: //oracle:1521/XE
      ORACLE_USER: spike
      ORACLE_PASSWORD: spike123
      MYSQL_DSN: mysql://spike:spike123@mysql:3306/qbs
    volumes:
      - ../../../..:/workspace:ro   # 仓库根，方便在容器里直接看 fixtures
    working_dir: /workspace

  # ---- 演练台（#152 / ADR-0041 增补 1）：两台 centos:7「主机」容器 ----
  # 客户现场是两台 CentOS 7：源端装 source（挨着 Oracle），目标端装 sink（挨着 MySQL），
  # 两库之间网络不通，只有 source → sink 一跳走公网、且只开白名单端口。这里把那张拓扑搭出来。
  #
  # **拓扑图与「三件刻意为之的事」的正文在 README「装机演练台」一节**，只此一份——
  # 抄成三份的话，改了一处另两处就开始说不同的话。下面每个字段只注它自己那一句为什么。
  host-source:
    image: centos:7                  # 不 build 自定义镜像、不挂仓库 —— 演练要的是「干净机器」
    platform: linux/amd64            # 客户机是 x86_64 CentOS 7，#151 的 glibc 2.17 下界也在这架构上
    container_name: qbs-host-source
    profiles: ["rehearsal"]          # 默认 up.sh 不起它们，四份既有台架的起停不受影响
    init: true                       # PID 1 要能接 SIGTERM，也要收养 stunnel / source 的孤儿进程
    command: ["sleep", "infinity"]
    networks: [src-side]
    extra_hosts:
      # 「公网」那一跳的落点：宿主上暴露出来的白名单端口
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle:
        condition: service_healthy

  host-target:
    image: centos:7
    platform: linux/amd64
    container_name: qbs-host-target
    profiles: ["rehearsal"]
    init: true
    command: ["sleep", "infinity"]
    networks: [dst-side]
    ports:
      # 白名单口：目标端**唯一**对外露出的端口，给 #153 的 stunnel 服务端用。
      # sink 本身仍然只绑目标端主机的回环，ADR-0024 的兜底形态原样成立。
      - "127.0.0.1:15443:15443"
    depends_on:
      mysql:
        condition: service_healthy

networks:
  default:
  src-side:
    name: qbs-src-side
  dst-side:
    name: qbs-dst-side
