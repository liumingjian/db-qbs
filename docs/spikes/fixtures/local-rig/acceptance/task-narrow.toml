# M1 台架的窄表任务定义 —— 结构化规格，SQL 由它现算，不再存在这里。
#
# 过滤是一段自由 WHERE 文本：台架里 D_BIZ 是纯日期（时分秒为零），
# 单点等值与旧那条 `>= d AND < d+1` 半开区间同集合，所以照旧写等值。

[spec]
owner = "SPIKE"
table = "T_M1_NARROW"
target_table = "M1_NARROW"
# 目标字段与源列同名——恒等映射（ADR-0038 §2）。台架搬的是同名列，
# 所以每条映射的 target 就是 source；改名那一路归 C 系列去证。
columns = [
  { source = "ROW_ID", target = "ROW_ID" },
  { source = "V_TEXT", target = "V_TEXT" },
  { source = "D_BIZ", target = "D_BIZ" },
]
# 主键不再必选（#261）：空的主键就是「目标表无主键，纯追加写」。这两份台架任务
# 走的仍是 upsert 那条路，主键一列都不能少——撤掉 DELETE 之后，幂等全靠它。
# 写入模式（#261/#264）。两档：APPEND 与 CLEAR_THEN_IMPORT；台架走追加写这一档。
# 这一行必须在，任务定义不给默认值。
write_mode = "APPEND"
primary_key = ["ROW_ID"]
# 过滤是一段自由 WHERE 文本，原样拼进生成语句的 `WHERE` 后面。
# 台架按日期造态时替换的就是这一行（见 run-m1-acceptance.sh 的 `materialize_task`）。
where_clause = "D_BIZ = DATE '2026-08-14'"


# 两端连接直接写在任务文件里（ADR-0037 §1/§8）：编排进程在发起时把数据源解成明文塞进
# 临时任务文件，M1 的 run 子进程是直接调起来的，没有编排进程，所以这一份由台架自己写死。
# 口令是台架 fixture 的公开口令，不是任何真实凭据。
[oracle]
connect_string = "//oracle:1521/XE"
username = "spike"
password = "spike123"
client_lib_dir = "/opt/oracle/instantclient_19_32"

# `sink.toml` 的 mysql_dsn / database 已退役（ADR-0037 §2），库名随本段过线。
[target]
host = "mysql"
port = 3306
username = "spike"
password = "spike123"
database = "qbs"

