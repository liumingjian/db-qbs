# M1 台架的窄表任务定义 —— 结构化规格（ADR-0036 §1），SQL 由它现算，不再存在这里。
#
# 旧的 `d_biz >= :biz_date AND d_biz < :biz_date + 1` 半开区间在 v1 表达不出来：
# 比较符只有 `>` `<` `=`（ADR-0035 §3 字面），没有 `>=` / `<=`。这里用 `= d` 顶上——
# 台架里 d_biz 是纯日期（时分秒为零），单点等值与原半开区间同集合。
# 这条表达力缺口挂在 ADR-0035 的时效 2 上，不要自作主张加 `>=`。

[spec]
owner = "SPIKE"
table = "T_M1_NARROW"
target_table = "M1_NARROW"
# 目标字段与源列同名——恒等映射（ADR-0038 §2）。台架搬的是同名列，
# 所以每条映射的 target 就是 source；改名那一路归 C 系列去证。
columns = [
  { source = "ROW_ID", target = "ROW_ID" },
  { source = "V_TEXT", target = "V_TEXT" },
  { source = "D_BIZ", target = "D_BIZ" },
]
# 主键必选（所有者 2026-08-18 裁定）：撤掉 DELETE 之后，幂等全靠它。
primary_key = ["ROW_ID"]

[[spec.conditions]]
column = "D_BIZ"
operator = "eq"
value_type = "date"
parameter = "d_biz"
value_source = "runtime"
constant = ""

# 两端连接直接写在任务文件里（ADR-0037 §1/§8）：编排进程在发起时把数据源解成明文塞进
# 临时任务文件，M1 的 run 子进程是直接调起来的，没有编排进程，所以这一份由台架自己写死。
# 口令是台架 fixture 的公开口令，不是任何真实凭据。
[oracle]
connect_string = "//oracle:1521/XE"
username = "spike"
password = "spike123"
client_lib_dir = "/opt/oracle/instantclient_19_32"

# `sink.toml` 的 mysql_dsn / database 已退役（ADR-0037 §2），库名随本段过线。
[target]
host = "mysql"
port = 3306
username = "spike"
password = "spike123"
database = "qbs"

[run_params]
d_biz = "2026-08-14"
