# M1 台架的宽表任务定义 —— 结构化规格（ADR-0036 §1），SQL 由它现算，不再存在这里。
#
# 旧的 `d_biz >= :biz_date AND d_biz < :biz_date + 1` 半开区间在 v1 表达不出来：
# 比较符只有 `>` `<` `=`（ADR-0035 §3 字面），没有 `>=` / `<=`。这里用 `= d` 顶上——
# 台架里 d_biz 是纯日期（时分秒为零），单点等值与原半开区间同集合。
# 这条表达力缺口挂在 ADR-0035 的时效 2 上，不要自作主张加 `>=`。

[spec]
owner = "SPIKE"
table = "T_M1_WIDE"
target_table = "M1_WIDE"
columns = [
  "ROW_ID", "D_BIZ", "C01", "C02", "C03", "C04", "C05", "C06",
  "C07", "C08", "C09", "C10", "C11", "C12", "C13", "C14",
  "C15", "C16", "C17", "C18", "C19", "C20", "C21", "C22",
  "C23", "C24", "C25", "C26", "C27", "C28", "C29", "C30",
  "C31", "C32", "C33", "C34", "C35", "C36", "C37", "C38",
  "C39", "C40", "C41", "C42", "C43", "C44", "C45", "C46",
  "C47", "C48", "C49", "C50", "C51", "C52", "C53", "C54",
  "C55", "C56", "C57", "C58", "C59", "C60", "C61", "C62",
  "C63", "C64", "C65", "C66", "C67", "C68"
]
# 主键必选（所有者 2026-08-18 裁定）：撤掉 DELETE 之后，幂等全靠它。
primary_key = ["ROW_ID"]

[[spec.conditions]]
column = "D_BIZ"
operator = "eq"
value_type = "date"
parameter = "d_biz"
value_source = "runtime"
constant = ""

[run_params]
d_biz = "2026-08-14"
