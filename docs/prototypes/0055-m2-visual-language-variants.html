<title>db-qbs 视觉语言</title>

<style>
/* ============================================================
   对比页外壳（chrome）——自身是中性的，让各变体自己说话
   ============================================================ */
:root {
  --c-bg: #f2f3f4;
  --c-panel: #ffffff;
  --c-line: #d9dcde;
  --c-text: #16191c;
  --c-dim: #5b6167;
  --c-mute: #878e95;
  --c-accent: #1f5f8b;
  --c-shadow: 0 1px 2px rgba(16, 20, 24, .06), 0 8px 24px -12px rgba(16, 20, 24, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-bg: #16181b;
    --c-panel: #1e2126;
    --c-line: #32373d;
    --c-text: #e6e9ec;
    --c-dim: #a2a9b0;
    --c-mute: #767e86;
    --c-accent: #6fb3dd;
    --c-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --c-bg: #16181b;
  --c-panel: #1e2126;
  --c-line: #32373d;
  --c-text: #e6e9ec;
  --c-dim: #a2a9b0;
  --c-mute: #767e86;
  --c-accent: #6fb3dd;
  --c-shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .6);
}

/* 中文优先字体栈：正文中文在前，西文回退在后；数字单独一套等宽 */
:root {
  --font-cn: "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans SC",
             "Noto Sans CJK SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  --font-num: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono",
              Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-cn);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.chrome {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--c-panel);
  border-bottom: 1px solid var(--c-line);
  padding: 14px 24px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
}
.chrome h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: .01em;
}
.chrome .sub {
  color: var(--c-mute);
  font-size: 12px;
  margin-left: -8px;
}
.spacer { flex: 1 1 auto; }

.switch { display: flex; gap: 0; border: 1px solid var(--c-line); border-radius: 6px; overflow: hidden; }
.switch button {
  font: inherit;
  font-size: 13px;
  padding: 5px 14px;
  border: 0;
  border-right: 1px solid var(--c-line);
  background: transparent;
  color: var(--c-dim);
  cursor: pointer;
}
.switch button:last-child { border-right: 0; }
.switch button[aria-pressed="true"] { background: var(--c-accent); color: #fff; }
.switch button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }

main { padding: 24px; display: flex; flex-direction: column; gap: 24px; max-width: 1180px; margin: 0 auto; }

.brief {
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 8px;
  padding: 18px 22px;
  box-shadow: var(--c-shadow);
}
.brief h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; text-wrap: balance; }
.brief .tag { color: var(--c-mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.brief p { margin: 10px 0 0; color: var(--c-dim); max-width: 62ch; }
.brief dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 13px; }
.brief dt { color: var(--c-mute); }
.brief dd { margin: 0; color: var(--c-dim); }
.brief .swatches { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.brief .sw {
  width: 92px; height: 46px; border-radius: 4px; border: 1px solid var(--c-line);
  font-family: var(--font-num); font-size: 10px; padding: 3px 5px; line-height: 1.3;
  display: flex; align-items: flex-end;
}

.screens { display: flex; flex-direction: column; gap: 18px; }
.screen-label {
  font-size: 12px; color: var(--c-mute); letter-spacing: .06em;
  display: flex; align-items: baseline; gap: 8px;
}
.screen-label b { color: var(--c-dim); font-weight: 600; letter-spacing: 0; font-size: 13px; }

/* ============================================================
   变体外框：所有 mockup 用同一套结构类，靠 token 与少量结构覆盖拉开方向
   ============================================================ */
.variant {
  --ok: #2e7d54; --crit: #c0392f; --warn: #a9710d; --info: #1f5f8b;
  --radius: 6px; --row-h: 34px; --gap: 16px; --pad: 18px;
  --num-size: 13px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--c-line);
  box-shadow: var(--c-shadow);
  font-family: var(--font-cn);
  background: var(--bg);
  color: var(--text);
}
.variant .pane { background: var(--bg); padding: var(--pad); }
.variant .pane + .pane { border-top: 1px solid var(--line); }

.hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.hd .rid { font-family: var(--font-num); font-size: 13px; color: var(--text); letter-spacing: -.01em; }
.hd .meta { color: var(--dim); font-size: 12px; }
.hd .meta b { color: var(--text); font-weight: 600; }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.kv > div { background: var(--panel); padding: 9px 12px; }
.kv dt { font-size: 11px; color: var(--mute); margin: 0 0 2px; letter-spacing: .04em; }
.kv dd { margin: 0; font-family: var(--font-num); font-size: var(--num-size); font-variant-numeric: tabular-nums; color: var(--text); }
.kv dd.big { font-size: 17px; }
.kv dd em { font-style: normal; color: var(--crit); }

table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th {
  text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em;
  color: var(--mute); padding: 6px 10px; border-bottom: 1px solid var(--line-strong);
  white-space: nowrap;
}
table.grid td { padding: 0 10px; height: var(--row-h); border-bottom: 1px solid var(--line); color: var(--text); vertical-align: middle; }
table.grid td.n { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
table.grid td.t { font-family: var(--font-num); font-size: 12px; color: var(--dim); }
table.grid tr:last-child td { border-bottom: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }

/* 状态表达：三条互不混用的视觉轴 —— 阶段 / 资源终态 / 错误码 */
.phase { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-family: var(--font-num); }
.phase .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); }
.phase.on { color: var(--text); }
.phase.on .dot { background: var(--info); }
.phase.done .dot { background: var(--ok); }
.phase.dead .dot { background: var(--crit); }
.phaseline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.phaseline .arrow { color: var(--mute); font-size: 11px; }

.term {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--font-num); font-size: 12px; letter-spacing: .02em;
  padding: 3px 9px; border-radius: var(--badge-radius, 4px);
  background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--term-bd);
}
.term.swapped { --term-bg: var(--ok-bg); --term-fg: var(--ok); --term-bd: var(--ok-bd); }
.term.discarded { --term-bg: var(--mute-bg); --term-fg: var(--dim); --term-bd: var(--line-strong); }
.term.running { --term-bg: var(--info-bg); --term-fg: var(--info); --term-bd: var(--info-bd); }

.code {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-num); font-size: 12px;
  padding: 2px 8px; border-radius: var(--badge-radius, 4px);
  border: 1px dashed var(--code-bd); color: var(--code-fg); background: var(--code-bg);
}
.code .http { font-size: 10px; opacity: .75; }
.code.reject { --code-bd: var(--crit-bd); --code-fg: var(--crit); --code-bg: var(--crit-bg); }
.code.internal { --code-bd: var(--warn-bd); --code-fg: var(--warn); --code-bg: var(--warn-bg); border-style: solid; }

.plain {
  border-left: 3px solid var(--crit);
  background: var(--crit-bg);
  padding: 10px 14px;
  border-radius: 0 var(--radius) var(--radius) 0;
  color: var(--text);
  margin: 12px 0 0;
  max-width: 68ch;
}
.plain b { font-weight: 600; }
.verdict { margin: 12px 0 0; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.verdict .pick, .verdict .drop {
  flex: 1 1 240px; padding: 9px 12px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.6;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--dim);
}
.verdict .pick { border-color: var(--crit-bd); background: var(--crit-bg); color: var(--text); }
.verdict .drop { opacity: .55; }
.verdict .lab { display: block; font-size: 11px; color: var(--mute); letter-spacing: .05em; margin-bottom: 2px; }

.locate { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; }
.locate span { font-family: var(--font-num); color: var(--mute); }
.locate span.yes { color: var(--ok); }
.locate span.no { color: var(--mute); text-decoration: line-through; text-decoration-color: var(--line-strong); }

/* 业务值容器 —— ADR-0017 §4 的 column / value 在 UI 上唯一的落点 */
.sensitive {
  margin-top: 12px;
  border: 1px solid var(--warn-bd);
  border-radius: var(--radius);
  background: var(--warn-bg);
  overflow: hidden;
}
.sensitive .top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 7px 12px; font-size: 12px; color: var(--warn);
  border-bottom: 1px solid var(--warn-bd);
}
.sensitive .top .why { color: var(--dim); font-size: 11.5px; }
.sensitive .body { padding: 10px 12px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-family: var(--font-num); font-size: 12.5px; }
.sensitive .body .k { color: var(--mute); }
.sensitive .val { color: var(--text); }
.sensitive[data-masked="true"] .val { filter: blur(4.5px); user-select: none; }
.reveal {
  font: inherit; font-size: 11.5px; font-family: var(--font-cn);
  border: 1px solid var(--warn-bd); background: transparent; color: var(--warn);
  border-radius: 4px; padding: 1px 9px; cursor: pointer;
}
.reveal:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.legend .cell { display: flex; flex-direction: column; gap: 4px; }
.legend .note { font-size: 11px; color: var(--mute); }
.axis { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
.axis + .legend { margin-bottom: 16px; }

/* ---------- 方向 A：值班台（深色优先 / 极高密度 / 单色 + 极小面积语义色） ---------- */
.variant[data-v="a"] {
  --bg: #0f1419; --panel: #141a21; --line: #1e262f; --line-strong: #2b3644;
  --text: #dfe6ee; --dim: #93a1b0; --mute: #5f6e7e;
  --ok: #4fb286; --crit: #e5636b; --warn: #d8a13f; --info: #63a0d8;
  --ok-bg: rgba(79,178,134,.10); --ok-bd: rgba(79,178,134,.35);
  --crit-bg: rgba(229,99,107,.09); --crit-bd: rgba(229,99,107,.35);
  --warn-bg: rgba(216,161,63,.09); --warn-bd: rgba(216,161,63,.35);
  --info-bg: rgba(99,160,216,.10); --info-bd: rgba(99,160,216,.35);
  --mute-bg: rgba(255,255,255,.03);
  --radius: 3px; --badge-radius: 2px; --row-h: 27px; --pad: 14px; --num-size: 12.5px;
  font-size: 13px;
}
.variant[data-v="a"] table.grid { font-size: 12.5px; }
.variant[data-v="a"] table.grid td { padding: 0 8px; }
.variant[data-v="a"] .tablewrap { border-radius: 3px; }
.variant[data-v="a"] .kv > div { padding: 7px 10px; }
.variant[data-v="a"][data-mode="light"] {
  --bg: #eef1f4; --panel: #ffffff; --line: #dfe4e9; --line-strong: #c4ccd4;
  --text: #10161c; --dim: #4f5a65; --mute: #7d8894;
  --ok: #1d7a53; --crit: #b8323b; --warn: #8a6410; --info: #1c5c8f;
  --ok-bg: rgba(29,122,83,.07); --ok-bd: rgba(29,122,83,.30);
  --crit-bg: rgba(184,50,59,.06); --crit-bd: rgba(184,50,59,.30);
  --warn-bg: rgba(138,100,16,.07); --warn-bd: rgba(138,100,16,.30);
  --info-bg: rgba(28,92,143,.07); --info-bd: rgba(28,92,143,.30);
  --mute-bg: rgba(0,0,0,.03);
}

/* ---------- 方向 B：卷宗（浅色纸面 / 低密度 / 段落式人话在前 / 色仅点缀） ---------- */
.variant[data-v="b"] {
  --bg: #f6f7f6; --panel: #ffffff; --line: #e3e6e3; --line-strong: #cdd2cd;
  --text: #1b201d; --dim: #545c56; --mute: #858d87;
  --ok: #2f6d4f; --crit: #a33a34; --warn: #8a6216; --info: #2f4f7a;
  --ok-bg: #eef4f0; --ok-bd: #cadbd1;
  --crit-bg: #faf0ef; --crit-bd: #e6cdc9;
  --warn-bg: #faf5ea; --warn-bd: #e5d9bf;
  --info-bg: #eef2f7; --info-bd: #cdd7e4;
  --mute-bg: #f2f3f2;
  --radius: 8px; --badge-radius: 999px; --row-h: 42px; --pad: 26px; --num-size: 13.5px;
  font-size: 14.5px;
  line-height: 1.75;
}
.variant[data-v="b"] .pane { padding: var(--pad) 28px; }
.variant[data-v="b"] .kv { background: transparent; border: 0; gap: 0; }
.variant[data-v="b"] .kv > div { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 8px 8px 0; }
.variant[data-v="b"] .plain { border-left: 0; border: 1px solid var(--crit-bd); border-radius: 8px; padding: 14px 18px; font-size: 14.5px; }
.variant[data-v="b"] table.grid { font-size: 14px; }
.variant[data-v="b"] .tablewrap { border-radius: 8px; }
.variant[data-v="b"] .term, .variant[data-v="b"] .code { padding: 4px 12px; font-size: 12.5px; }
.variant[data-v="b"] .code { border-style: solid; }
.variant[data-v="b"][data-mode="dark"] {
  --bg: #191c1a; --panel: #21251f; --line: #333831; --line-strong: #464c44;
  --text: #e8ebe6; --dim: #a7ada4; --mute: #7d857b;
  --ok: #6fbb90; --crit: #e08079; --warn: #d3a64f; --info: #7fa5d4;
  --ok-bg: #1e2a23; --ok-bd: #33463a;
  --crit-bg: #2c2020; --crit-bd: #4a3230;
  --warn-bg: #2b261a; --warn-bd: #493f28;
  --info-bg: #1f2530; --info-bd: #35404f;
  --mute-bg: #232722;
}

/* ---------- 方向 C：双轴仪表（中密度 / 石墨 + 一根青色轴 / 网格线做层级） ---------- */
.variant[data-v="c"] {
  --bg: #fbfbfc; --panel: #ffffff; --line: #e6e8ec; --line-strong: #b9bec7;
  --text: #14171c; --dim: #4d545e; --mute: #838b96;
  --ok: #0f766e; --crit: #b4232c; --warn: #9a6209; --info: #1e5f96;
  --ok-bg: #eaf5f3; --ok-bd: #b9ded8;
  --crit-bg: #fdf0f0; --crit-bd: #eec7c8;
  --warn-bg: #fdf5e6; --warn-bd: #eeddb8;
  --info-bg: #eef3f9; --info-bd: #c6d7e8;
  --mute-bg: #f4f5f7;
  --radius: 4px; --badge-radius: 3px; --row-h: 32px; --pad: 20px; --num-size: 13px;
  font-size: 14px;
}
.variant[data-v="c"] .tablewrap { border-radius: 4px; }
.variant[data-v="c"] table.grid td { border-right: 1px solid var(--line); }
.variant[data-v="c"] table.grid th { border-right: 1px solid var(--line); background: var(--mute-bg); }
.variant[data-v="c"] table.grid td:last-child,
.variant[data-v="c"] table.grid th:last-child { border-right: 0; }
.variant[data-v="c"] .term { border-radius: 3px; font-weight: 600; }
.variant[data-v="c"] .term.swapped { --term-bg: var(--ok); --term-fg: #ffffff; --term-bd: var(--ok); }
.variant[data-v="c"] .term.running { --term-bg: var(--info); --term-fg: #ffffff; --term-bd: var(--info); }
.variant[data-v="c"] .term.discarded { --term-bg: transparent; --term-fg: var(--dim); --term-bd: var(--line-strong); }
.variant[data-v="c"] .kv > div { padding: 10px 13px; }
.variant[data-v="c"][data-mode="dark"] {
  --bg: #101317; --panel: #171b21; --line: #262c34; --line-strong: #3b434e;
  --text: #e4e8ed; --dim: #9aa3ae; --mute: #6c7681;
  --ok: #3fb0a2; --crit: #e0656d; --warn: #d09a3c; --info: #5f9ed6;
  --ok-bg: #14241f; --ok-bd: #26443d;
  --crit-bg: #251618; --crit-bd: #48282c;
  --warn-bg: #241d12; --warn-bd: #453721;
  --info-bg: #141d27; --info-bd: #26384a;
  --mute-bg: #1b2028;
}
.variant[data-v="c"][data-mode="dark"] .term.swapped { --term-fg: #06120f; }
.variant[data-v="c"][data-mode="dark"] .term.running { --term-fg: #08131d; }

/* ---------- 方向 D：调度台（DolphinScheduler 范式 / 浅色中后台 / 左导航 + 白卡片） ---------- */
.variant[data-v="d"] {
  --bg: #f0f2f5; --panel: #ffffff; --line: #e8eaec; --line-strong: #dcdee2;
  --text: #17233d; --dim: #515a6e; --mute: #808695;
  --brand: #2c8af0; --brand-dim: #ecf5ff;
  --ok: #19be6b; --crit: #ed4014; --warn: #ff9900; --info: #2c8af0;
  --ok-bg: #f0faf4; --ok-bd: #c4ecd6;
  --crit-bg: #fef3f0; --crit-bd: #fbd2c7;
  --warn-bg: #fff8ec; --warn-bd: #ffe1b8;
  --info-bg: #ecf5ff; --info-bd: #c9e0fb;
  --mute-bg: #f8f8f9;
  --radius: 4px; --badge-radius: 3px; --row-h: 44px; --pad: 20px; --num-size: 13px;
  font-size: 14px;
  line-height: 1.55;
}
.variant[data-v="d"] .pane { background: var(--panel); }
.variant[data-v="d"] .pane + .pane { border-top: 0; }
.variant[data-v="d"] table.grid { font-size: 13.5px; }
.variant[data-v="d"] table.grid th { background: var(--mute-bg); color: var(--text); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.variant[data-v="d"] table.grid td { padding: 0 12px; }
.variant[data-v="d"] table.grid tbody tr:hover td { background: #f5f7fa; }
.variant[data-v="d"] .tablewrap { border-radius: 4px; }
.variant[data-v="d"] .term { border-radius: 3px; padding: 2px 9px; }
.variant[data-v="d"] .code { border-style: solid; border-radius: 3px; }
.variant[data-v="d"] .kv > div { padding: 12px 14px; }
.variant[data-v="d"][data-mode="dark"] {
  --bg: #14171c; --panel: #1b1f26; --line: #2a2f38; --line-strong: #3a414c;
  --text: #e3e7ee; --dim: #9aa3b0; --mute: #6f7885;
  --brand: #4d9bf5; --brand-dim: #1b2a3c;
  --ok: #35c97f; --crit: #f2603c; --warn: #f0a93c; --info: #4d9bf5;
  --ok-bg: #16261e; --ok-bd: #26452f;
  --crit-bg: #271a17; --crit-bd: #4a2b23;
  --warn-bg: #261f14; --warn-bd: #46381f;
  --info-bg: #16212f; --info-bd: #26394f;
  --mute-bg: #1f242c;
}
.variant[data-v="d"][data-mode="dark"] table.grid tbody tr:hover td { background: #212730; }

/* D 的应用外壳 —— 左导航 + 顶栏面包屑 + 灰底内容区 */
.app { display: grid; grid-template-columns: 188px 1fr; min-height: 620px; background: var(--bg); }
.app .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.app .brand {
  height: 52px; display: flex; align-items: center; gap: 9px; padding: 0 16px;
  border-bottom: 1px solid var(--line); font-weight: 600; font-size: 15px; color: var(--text);
}
.app .brand .mark {

          <div class="card"><div class="cardhd">运行详情 <span class="sub">校验门禁未过</span></div>${screenFail()}</div>
          <div class="card"><div class="cardhd">发起被拒 <span class="sub">映射预检一次报全部列</span></div>${screenPrecheck()}</div>
          <div class="card"><div class="cardhd">状态与错误的视觉语言 <span class="sub">三条轴，后续所有屏只许引用</span></div>${screenLegend()}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  const v = document.querySelector("[data-pick][aria-pressed='true']").dataset.pick;
  const mode = document.querySelector("[data-mode][aria-pressed='true']").dataset.mode;
  const b = BRIEFS[v];
  const sw = b.swatches.map(([hex, label]) =>
    `<span class="sw" style="background:${hex};color:${["#0F1419","#141A21","#2F4F7A","#2F6D4F","#A33A34","#8A6216","#0F766E","#1E5F96","#B4232C","#9A6209","#2C8AF0","#19BE6B","#ED4014"].includes(hex) ? "#fff" : "#16191c"}">${hex}<br>${label}</span>`
  ).join("");
  document.getElementById("stage").innerHTML = `
    <section class="brief">
      <p class="tag">${b.tag}</p>
      <h2>${b.name}</h2>
      <p>${b.lead}</p>
      <div class="swatches">${sw}</div>
      <dl>
        <dt>密度</dt><dd>${b.density}</dd>
        <dt>色彩策略</dt><dd>${b.color}</dd>
        <dt>层级手法</dt><dd>${b.hier}</dd>
        <dt>暗色主题</dt><dd>${b.dark}</dd>
        <dt>要付的账</dt><dd>${b.cost}</dd>
      </dl>
    </section>
    <div class="screens">${v === "d" ? `
      <p class="screen-label"><b>完整应用外壳</b>　左导航 + 面包屑 + 灰底内容区；导航里「定时调度 / 告警」只占位并标注非 V1，不是 M2 的功能</p>
      ${renderD(mode)}
      <p class="footnote">运行历史列表的<b>信息架构</b>归 #49（已解，ADR-0020）与 #56，本页只示范它的<b>视觉</b>形态。「发起运行」按钮与实时进度不在本票。</p>
    </div>` : `
      <p class="screen-label"><b>面 3 · run 失败（校验门禁）</b>　终态、错误码、人话、门禁四数与诊断数、两类分法、定位粒度</p>
      <div class="variant" data-v="${v}" data-mode="${mode}">${screenFail()}</div>

      <p class="screen-label"><b>面 3′ · 预检失败（一次报全部列）</b>　失败粒度完全不同的另一类，并含业务数据值的容器</p>
      <div class="variant" data-v="${v}" data-mode="${mode}">${screenPrecheck()}</div>

      <p class="screen-label"><b>面 2 · run 成功后的详情</b>　校验两数、切换两数、分段耗时</p>
      <div class="variant" data-v="${v}" data-mode="${mode}">${screenOk()}</div>

      <p class="screen-label"><b>状态与错误的视觉语言</b>　三条轴的完整取值，后续所有屏只许引用</p>
      <div class="variant" data-v="${v}" data-mode="${mode}">${screenLegend()}</div>
    </div>`}
    <p class="footnote">数字取自 #36 线框与 ADR-0013 §6；错误码取自 ADR-0010 闭集 12（含 ADR-0022 的 <code>SWAP_TARGET_BUSY</code>）。历史列表与实时进度不在本页——信息架构归 #49 / #56，本页只定「长什么样」。</p>`;
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-pick], [data-mode]");
  if (btn) {
    const group = btn.dataset.pick ? "data-pick" : "data-mode";
    document.querySelectorAll(`[${group}]`).forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    render();
    return;
  }
  const rev = e.target.closest(".reveal");
  if (rev) {
    const box = rev.closest(".sensitive");
    const masked = box.dataset.masked === "true";
    box.dataset.masked = String(!masked);
    rev.textContent = masked ? "隐藏" : "显示";
  }
});

document.addEventListener("keydown", (e) => {
  const map = { "1": "d", "2": "a", "3": "b", "4": "c" };
  if (map[e.key]) {
    document.querySelector(`[data-pick="${map[e.key]}"]`).click();
  }
});

render();
</script>
