; ============================================================================
; db-qbs 源端隧道 —— stunnel **客户端**（装在跑 source 的那台 CentOS 7 上）
;
;     source ──▶ 127.0.0.1:@@SINK_LOCAL_PORT@@ ── stunnel ── TLS 1.2，双向证书 ──▶
;                                        @@TARGET_HOST@@:@@TARGET_PORT@@（客户白名单口）
;
; **产品一个字节不改**：source 打的仍是 `http://127.0.0.1:8080`。scheme 仍是 `http`
; （`crates/source/src/protocol.rs` 硬性拒绝非 http，不必放开），
; 明文只在本机回环上走这一段，出机器之前已经进了 TLS。
;
; 所以 `accept` 的端口**必须**与「目标端 Agent」屏里注册的那台 agent 的地址端口一致
; （默认 8080）。改了这里就得去界面上改那条 agent 记录，那是本隧道唯一会碰到产品配置的地方。
; （2026-08-24 前它写在 `source.toml::sink_base_url` 里，该字段已随 ADR-0044 §5 退役。）
;
; 占位符（`@@...@@`）全部要填，一个都不能留。填法见 ../README.md。
; ============================================================================

; --- 进程 ---
; `foreground = no`：stunnel 自己转后台，并把 pid 写进下面那个文件。
; **真机上的 systemd unit（同目录 `db-qbs-stunnel.service`）就是按这个形态写的**：
; `Type=forking` + `PIDFile`，两边对得上，照抄即可、不必改这一行。
; 真要改成 `yes`（前台），unit 的 `Type` 必须同时改成 `simple`，
; 否则 systemd 会一直等一个不会退出的父进程，服务起不来。
foreground = no
pid = /var/run/db-qbs-stunnel-sink.pid
output = /var/log/db-qbs-stunnel-sink.log
debug = 4

; 与服务端镜像对称：本端出示 source.crt，只认对端那张 target.crt。
; CentOS 7 的 stunnel 4.56 没有 `checkHost`——钉住证书文件本身就是身份校验。
; 少了 `verify = 2` 这条，隧道只加密不认人：中间人换一张自签证书照样能接下来。
cert   = /etc/stunnel/db-qbs/source.crt
key    = /etc/stunnel/db-qbs/source.key
CAfile = /etc/stunnel/db-qbs/target.crt
verify = 2

; 见服务端同名段落：5.x 上若报错，换 `sslVersionMin = TLSv1.2`。
sslVersion = TLSv1.2
ciphers = HIGH:!aNULL:!eNULL:!MD5:!RC4:!3DES:!EXPORT

[db-qbs-sink]
client  = yes
; 只绑回环：隧道入口不该被这台机器之外的任何人用（它进去就是明文）。
accept  = 127.0.0.1:@@SINK_LOCAL_PORT@@
connect = @@TARGET_HOST@@:@@TARGET_PORT@@
