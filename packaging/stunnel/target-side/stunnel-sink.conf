; ============================================================================
; db-qbs 目标端隧道 —— stunnel **服务端**（装在跑 sink 的那台 CentOS 7 上）
;
; 它是「MySQL 口令明文过线，通道必须可信」这条部署前提的兑现物（ADR-0037 §4、
; ADR-0041 §4）。公网上过的是 TLS，落地才是 sink 听的那个明文 HTTP：
;
;     公网 ── @@WHITELIST_PORT@@（客户白名单口，本机唯一对外露出的端口）
;              │  TLS 1.2，双向证书
;              └─▶ stunnel ──▶ 127.0.0.1:@@SINK_PORT@@   ← sink 仍然只绑回环
;
; **sink 的 listen 一个字都不用改**（`config/sink.toml.example` 里就是
; `127.0.0.1:8080`）——ADR-0024 那条「不做鉴权、靠只绑回环兜底」的形态原样成立：
; 回环之外摸不到 sink，摸得到的只有这个要证书才进得来的隧道口。
;
; 占位符（`@@...@@`）全部要填，一个都不能留。填法见 ../README.md。
; ============================================================================

; --- 进程 ---
; `foreground = no`：stunnel 自己转后台，并把 pid 写进下面那个文件。
; **真机上的 systemd unit（同目录 `db-qbs-stunnel.service`）就是按这个形态写的**：
; `Type=forking` + `PIDFile`，两边对得上，照抄即可、不必改这一行。
; 真要改成 `yes`（前台），unit 的 `Type` 必须同时改成 `simple`，
; 否则 systemd 会一直等一个不会退出的父进程，服务起不来。
foreground = no
pid = /var/run/db-qbs-stunnel-sink.pid
output = /var/log/db-qbs-stunnel-sink.log
; debug = 4（warning 及以上）。排障时临时调到 7，别长期开着——7 会把每个连接都记一行。
debug = 4

; --- 身份与信任 ---
; 两端各一张自签证书，互相把**对方那张**钉进 CAfile。自签证书自己就是自己的
; 信任锚，所以 `verify = 2`（要求对端出示证书并验签）在这里等价于「只认这一张」。
; CentOS 7 的 stunnel 是 4.56，没有 `checkHost`——**钉住证书文件本身就是身份校验**，
; 换一张证书就进不来。别把 CAfile 换成公共 CA 包，那等于谁都能进。
cert   = /etc/stunnel/db-qbs/target.crt
key    = /etc/stunnel/db-qbs/target.key
CAfile = /etc/stunnel/db-qbs/source.crt
verify = 2

; --- 协议下界 ---
; TLS 1.2 起步。CentOS 7 的 OpenSSL 是 1.0.2，给得到 TLS 1.2，给不到 1.3。
; stunnel 5.x 上 `sslVersion` 仍收，但更推荐 `sslVersionMin = TLSv1.2`；
; 若装出来的是 5.x 且这一行报错，换成 sslVersionMin 那一行。
sslVersion = TLSv1.2
ciphers = HIGH:!aNULL:!eNULL:!MD5:!RC4:!3DES:!EXPORT

[db-qbs-sink]
client  = no
accept  = 0.0.0.0:@@WHITELIST_PORT@@
connect = 127.0.0.1:@@SINK_PORT@@
