[workspace]
members = [
    "crates/shared",
    "crates/sink",
    "crates/source",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
oracle = "0.6.3"
rand = "0.8.5"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlparser = { version = "0.46.0", features = ["visitor"] }
tiny_http = "0.12.0"
toml = "0.8.20"
url = "=2.4.1"
ureq = { version = "=2.10.1", default-features = false, features = ["json"] }
