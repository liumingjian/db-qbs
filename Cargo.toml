[workspace]
members = [
    "crates/shared",
    "crates/sink",
    "crates/source",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
